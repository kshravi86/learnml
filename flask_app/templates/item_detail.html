<!DOCTYPE html>
<html>
<head>
    <title>Item Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ item.name }}</h1>
        <p><strong>ID:</strong> {{ item.id }}</p>
        <p><strong>Description:</strong> {{ item.description }}</p>
        <a href="{{ url_for('edit_item_form', item_id=item.id) }}" class="button">Edit</a>
        <a href="{{ url_for('list_items_html') }}">Back to list</a>
    </div>
</body>
</html>
